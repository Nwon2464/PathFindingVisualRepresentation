<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>東京都ルート探索</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="hud" aria-live="polite">
        <div class="hud-title">東京都ルート探索</div>
        <div id="hudPhase" class="hud-phase">地図データを読み込み中</div>
        <div class="hud-metrics">
            <div>
                <span>アルゴリズム</span>
                <strong id="hudAlgorithm">A*</strong>
            </div>
            <div>
                <span>訪問数</span>
                <strong id="hudVisited">0</strong>
            </div>
            <div>
                <span>距離</span>
                <strong id="hudDistance">--</strong>
            </div>
        </div>
    </div>

    <div id="controls" aria-label="Path finding controls">
        <div class="control-header">
            <h1>ルート探索</h1>
            <span id="status">地図データを読み込み中。</span>
        </div>

        <div class="control-row">
            <button class="mode-button" data-mode="start" type="button">始点を設定</button>
            <button class="mode-button is-active" data-mode="goal" type="button">終点を設定</button>
        </div>

        <div class="selection-summary">
            <div>
                <span>始点</span>
                <strong id="startValue">ノード 0</strong>
            </div>
            <div>
                <span>終点</span>
                <strong id="goalValue">未選択</strong>
            </div>
        </div>

        <label for="algorithmSelect">アルゴリズム</label>
        <select id="algorithmSelect">
            <option value="astar">A*</option>
            <option value="dijkstra">Dijkstra</option>
        </select>

        <div class="control-row">
            <button id="runButton" class="primary-button" type="button" disabled>実行</button>
            <button id="resetButton" type="button">クリア</button>
        </div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>

</html>
